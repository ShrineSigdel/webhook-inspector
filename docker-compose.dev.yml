# Development-only Postgres and Redis. The distinct project name keeps these
# containers and the pgdata volume separate from the full Compose stack.
name: webhook-inspector-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hooks
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: hooks
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  pgdata:
