server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE must not be buffered, and the connection is long-lived. This regex
    # location is checked before the /api/ prefix, so the stream gets these
    # settings instead of the normal proxy defaults.
    location ~ ^/api/endpoints/[^/]+/stream$ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hook/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match the Express raw-body limit, so Nginx rejects huge bodies before
        # they reach Node. Over the limit Nginx answers 413.
        client_max_body_size 1m;
    }

    # Client-side routes such as /endpoints/abc have no file on disk.
    location / {
        try_files $uri /index.html;
    }
}
